name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # v4.2.2 and v5.4 pinned by reviewed commit SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --group live
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: |
          uv run jev-dspy-benchmark \
            --dataset fixtures/tickets.jsonl \
            --responses fixtures/typesafe_responses.jsonl \
            --output /tmp/jev-dspy-benchmark \
            --field owner \
            --threshold 0.7 \
            --bootstrap-samples 2000 \
            --seed 17
          test -s /tmp/jev-dspy-benchmark/benchmark.json
          test "$(wc -l < /tmp/jev-dspy-benchmark/request_hashes.txt)" -eq 24
