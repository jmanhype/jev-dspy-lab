[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-dspy-lab"
version = "0.1.0"
description = "Reproducible calibration and selective-risk benchmarks for Jev/TypeSafe decisions in DSPy workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jmanhype" }]
dependencies = []

[project.scripts]
jev-dspy-benchmark = "jev_dspy_lab.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_dspy_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
